<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buckets">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<title>Strike Buckets</title>
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: rgba(0,0,0,.09);
  --accent: #0a84ff; --pos: #1f9d55; --neg: #d70015; --field: #ffffff; --shade: rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #111113; --ink: #f5f5f7; --muted: #8e8e93; --line: rgba(255,255,255,.12);
    --accent: #0a84ff; --pos: #30d158; --neg: #ff453a; --field: #1c1c1e; --shade: rgba(0,0,0,.6); }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; }
main { max-width: 860px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 40px); }
h1 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0; letter-spacing: .02em; text-transform: uppercase; }
.total { font-size: 44px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 14px; }
.sub.warn { color: var(--neg); }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 32px 0 10px; }
.actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 24px; max-width: 460px; }
.act { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; -webkit-tap-highlight-color: transparent; }
.act .circle { width: 56px; height: 56px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 24px; line-height: 1; transition: transform .1s; }
.act small { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.act:active:not(:disabled) .circle { transform: scale(.92); }
.act:hover:not(:disabled) .circle { border-color: var(--muted); }
.act:disabled { opacity: .35; cursor: default; }
@media (max-width: 340px) { .act .circle { width: 48px; height: 48px; font-size: 21px; } .act small { font-size: 11px; } }
.filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-bottom: 8px; }
.filters select { font-size: 15px; padding: 9px 12px; border-radius: 999px; }
.filters select.on { border-color: var(--accent); color: var(--accent); }
.fsum { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin: 0 4px 8px; }
.fsum a { color: var(--accent); text-decoration: none; }
.row .amt small { display: block; text-align: right; font-weight: 400; font-size: 12px; color: var(--muted); }
.pill { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; }
.pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.pill.danger { color: var(--neg); }
.pill:disabled { opacity: .4; cursor: default; }
.pill:active:not(:disabled) { transform: scale(.98); }
.buckets { display: grid; gap: 10px; }
.bucket { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; position: relative; overflow: hidden; }
.bucket .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.bucket .bal { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.bucket .pct { color: var(--muted); font-size: 13px; }
.bucket .btc { color: #f7931a; font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.sub.btc { color: #f7931a; }
.preview .r.head { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
.preview .r span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.two input { min-width: 0; }
.warnbox { color: var(--neg); font-size: 13px; margin-top: 10px; }
.bar { height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: var(--line); margin-top: 14px; }
.bar span { height: 100%; }
@media (max-width: 520px) {
  .buckets { grid-template-columns: 1fr !important; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .bucket { border: 0; border-radius: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
  .bucket + .bucket { border-top: 1px solid var(--line); }
  .bucket .bal { margin: 0; font-size: 18px; text-align: right; }
  .bucket .pct { text-align: right; }
}
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 16px; padding: 28px 16px; text-align: center; color: var(--muted); }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
.row + .row { border-top: 1px solid var(--line); }
.row .main { flex: 1; min-width: 0; }
.row .what { font-weight: 500; }
.row .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.amt.pos { color: var(--pos); } .amt.neg { color: var(--neg); }
.x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
.x:hover { color: var(--neg); }
.more { text-align: center; padding: 10px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; justify-content: center; }
.foot .pill { font-size: 14px; padding: 8px 14px; }
.note { color: var(--muted); font-size: 12px; text-align: center; margin-top: 16px; }
/* sheet */
.shade { position: fixed; inset: 0; background: var(--shade); display: none; align-items: flex-end; justify-content: center; z-index: 10; overscroll-behavior: contain; padding-top: calc(env(safe-area-inset-top) + 8px); }
.shade.open { display: flex; }
@media (min-width: 600px) { .shade { align-items: center; } }
.sheet { background: var(--bg); width: 100%; max-width: 460px; border-radius: 20px 20px 0 0; padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); max-height: calc(100vh - env(safe-area-inset-top) - 8px); max-height: calc(100dvh - env(safe-area-inset-top) - 8px); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
@media (min-width: 600px) { .sheet { border-radius: 20px; } }
.sheet h3 { margin: 0 0 4px; font-size: 20px; }
.sheet .hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input[type=date] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; min-height: 46px; text-align: left; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
input, select { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btns { display: flex; gap: 8px; margin-top: 20px; }
.btns .pill { flex: 1; }
.preview { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin-top: 14px; font-size: 14px; }
.preview .r { display: flex; justify-content: space-between; padding: 6px 0; }
.preview .r + .r { border-top: 1px solid var(--line); }
.manage-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.split-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; }
.split-row + .split-row { border-top: 1px solid var(--line); }
.split-row .who { flex: 1; min-width: 0; }
.split-row .who b { display: flex; align-items: center; gap: 6px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.split-row .who small { color: var(--muted); font-size: 12px; }
.split-row .who small.flag { color: var(--neg); }
.split-row input { width: 110px; flex: none; text-align: right; padding: 9px 10px; }
.split-row.bad input { border-color: var(--neg); outline-color: var(--neg); }
.split-row .pill { padding: 8px 10px; font-size: 13px; flex: none; }
.splits { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; margin-top: 4px; }
.status { margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--muted); }
.status.ok { color: var(--pos); } .status.bad { color: var(--neg); }
.manage-row input { flex: 1; }
.manage-row .pill { padding: 9px 12px; font-size: 14px; }
/* toast */
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); max-width: min(520px, calc(100% - 32px));
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; font-size: 14px; z-index: 20; display: none; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.toast.err { background: var(--neg); color: #fff; }
.update { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 10px); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); display: none; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 16px; font-size: 14px; z-index: 30; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.update.show { display: flex; }
.update .pill { padding: 7px 14px; font-size: 14px; }
.toast.show { display: block; }
.toast b { display: block; margin-bottom: 2px; }
.toast .close { float: right; margin-left: 12px; cursor: pointer; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>Strike cash</h1>
  <div class="total" id="total">$0.00</div>
  <div class="sub" id="recon">Not reconciled yet</div>
  <div class="sub btc" id="btcsum"></div>

  <div class="actions">
    <button class="act" data-act="deposit"><span class="circle">📥</span><small>Deposit</small></button>
    <button class="act" data-act="withdraw"><span class="circle">📤</span><small>Withdraw</small></button>
    <button class="act" data-act="move"><span class="circle">🔁</span><small>Move</small></button>
    <button class="act" data-act="interest" aria-label="BTC interest"><span class="circle">🪙</span><small>Interest</small></button>
    <button class="act" data-act="reconcile"><span class="circle">✅</span><small>Reconcile</small></button>
  </div>

  <h2>Buckets</h2>
  <div id="buckets"></div>

  <h2>Activity</h2>
  <div class="filters" id="filters">
    <select id="flt-type" aria-label="Filter by type">
      <option value="">All types</option><option value="deposit">Deposits</option><option value="withdraw">Withdrawals</option>
      <option value="move">Moves</option><option value="interest">Interest</option>
    </select>
    <select id="flt-bucket" aria-label="Filter by bucket"></select>
  </div>
  <div id="activity"></div>

  <div class="foot">
    <button class="pill" data-act="manage">Buckets…</button>
    <button class="pill" data-act="export">Back up</button>
    <button class="pill" data-act="import">Restore</button>
  </div>
  <p class="note">Stored only in this browser on this device. Back up after changes you care about.</p>
  <p class="note"><span id="ver"></span> · <a href="#" id="upd-check" style="color:inherit">Check for updates</a></p>
  <input type="file" id="file" accept="application/json,.json" hidden>
</main>

<div class="shade" id="shade"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="update" id="update" role="status"><span>A new version is ready.</span><button class="pill primary" id="upd-go">Update now</button></div>

<script>
"use strict";
const APP_VERSION = "2026-10-19.5"; // bump on every release — the update check compares this
const KEY = "strike-buckets-v1";
const COLORS = ["#0a84ff", "#30d158", "#ff9f0a", "#bf5af2", "#ff375f", "#64d2ff", "#ffd60a", "#ac8e68"];

/* ---------- state ---------- */
let state = { buckets: [], txns: [], lastRecon: null };
let showAll = false;
const filter = { type: "", bucket: "" };
let storageOk = true;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = normalize(JSON.parse(raw));
  } catch (e) {
    storageOk = false;
    showError("Couldn't read saved data",
      "This browser blocked storage (often Private Browsing). Nothing you enter will be kept. Do this: open the app in a normal Safari/Chrome window, then use Restore if you have a backup file.");
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) {
    showError("Couldn't save",
      "Your last change is on screen but not stored. Do this now: tap Back up to download a copy, then reload and use Restore with that file.");
  }
}
function normalize(s) {
  if (!s || !Array.isArray(s.buckets) || !Array.isArray(s.txns)) throw new Error("Not a Strike Buckets file");
  return { buckets: s.buckets, txns: s.txns, lastRecon: s.lastRecon || null };
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

/* ---------- money (integer cents) ---------- */
function parseMoney(str) {
  const s = String(str || "").replace(/[$,\s]/g, "");
  if (!/^\d*(\.\d{0,2})?$/.test(s) || s === "" || s === ".") return null;
  return Math.round(parseFloat(s) * 100);
}
const fmt = c => (c < 0 ? "-" : "") + "$" + (Math.abs(c) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* Cash balances. With `asOf` (YYYY-MM-DD), only entries dated on or before that day count. */
function balances(asOf) {
  const b = {}; state.buckets.forEach(x => b[x.id] = 0);
  for (const t of state.txns) {
    if (asOf && t.date > asOf) continue;
    if (t.type === "deposit" || t.type === "withdraw") { const p = partsOf(t), sign = t.type === "deposit" ? 1 : -1; for (const id in p) b[id] = (b[id] || 0) + sign * p[id]; }
    else if (t.type === "move") { b[t.from] = (b[t.from] || 0) - t.amount; b[t.to] = (b[t.to] || 0) + t.amount; }
    else if (t.type === "interest") for (const id in t.splits) b[id] = (b[id] || 0) + t.splits[id];
  }
  return b;
}
const totalOf = b => Object.values(b).reduce((a, c) => a + c, 0);
/* Deposits/withdrawals can be split across buckets ({id: cents}); early entries used a single `bucket`. */
const partsOf = t => t.parts || (t.bucket ? { [t.bucket]: t.amount } : {});
const bucketName = id => (state.buckets.find(x => x.id === id) || { name: "(deleted bucket)" }).name;
const activeBuckets = () => state.buckets.filter(x => !x.archived);

/* Split `amount` (cents or sats) across buckets in proportion to `weights`.
   Largest-remainder rounding so the pieces always add up to the exact amount. */
function splitProRata(amount, weights) {
  const ids = state.buckets.map(x => x.id).filter(id => weights[id] > 0);
  const base = ids.reduce((a, id) => a + weights[id], 0);
  if (!base) return null;
  const parts = ids.map(id => { const exact = amount * weights[id] / base; return { id, c: Math.floor(exact), r: exact - Math.floor(exact) }; });
  let left = amount - parts.reduce((a, p) => a + p.c, 0);
  parts.slice().sort((a, b) => b.r - a.r).forEach(p => { if (left > 0) { p.c++; left--; } });
  const out = {}; parts.forEach(p => { if (p.c) out[p.id] = p.c; });
  return out;
}

/* ---------- bitcoin interest ---------- */
/* "12345" = sats; "0.00012345" = BTC. Exact string math, no float drift. */
function parseSats(str) {
  const s = String(str || "").replace(/[,\s]/g, "").replace(/sats?$/i, "");
  if (/^\d+$/.test(s)) return parseInt(s, 10) || null;
  const m = s.match(/^(\d*)\.(\d{0,8})$/);
  if (!m || (m[1] === "" && m[2] === "")) return null;
  return (parseInt(m[1] || "0", 10) * 1e8 + parseInt((m[2] + "00000000").slice(0, 8), 10)) || null;
}
const fmtSats = n => n.toLocaleString("en-US") + " sats";
const fmtBtc = n => (n / 1e8).toFixed(8) + " BTC";
const DAY = 86400000;
const iso = ms => new Date(ms).toISOString().slice(0, 10);
const utc = d => Date.parse(d + "T00:00:00Z");
const shortDate = d => new Date(utc(d)).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
function prevMonth(d) { // [first, last] day of the calendar month before d
  const t = new Date(utc(d)), first = Date.UTC(t.getUTCFullYear(), t.getUTCMonth() - 1, 1), last = Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), 0);
  return [iso(first), iso(last)];
}
/* Average end-of-day cash balance per bucket over [start, end], inclusive. */
function avgDaily(start, end) {
  const sum = {}; let days = 0;
  for (let ms = utc(start); ms <= utc(end); ms += DAY) {
    const b = balances(iso(ms)); days++;
    for (const id in b) sum[id] = (sum[id] || 0) + Math.max(0, b[id]);
  }
  const avg = {}; for (const id in sum) avg[id] = days ? sum[id] / days : 0;
  return { avg, days };
}
function btcEarned() {
  const e = {};
  for (const t of state.txns) if (t.type === "btcInterest") for (const id in t.splits) e[id] = (e[id] || 0) + t.splits[id];
  return e;
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  const bal = balances(), total = totalOf(bal);
  $("total").textContent = fmt(total);

  const r = state.lastRecon, rec = $("recon");
  rec.classList.remove("warn");
  if (!r) rec.textContent = "Not reconciled yet — tap Reconcile with your Strike balance";
  else if (r.actual === total) rec.textContent = "Matches Strike as of " + r.date;
  else { rec.classList.add("warn"); rec.textContent = "Off from Strike by " + fmt(total - r.actual) + " (Strike said " + fmt(r.actual) + " on " + r.date + ")"; }

  const earned = btcEarned(), earnedTotal = Object.values(earned).reduce((a, c) => a + c, 0);
  $("btcsum").textContent = earnedTotal ? "₿ " + fmtSats(earnedTotal) + " of interest earned" : "";

  const list = activeBuckets();
  const box = $("buckets");
  if (!list.length) {
    box.innerHTML = '<div class="empty">No buckets yet.<br><br><button class="pill primary" data-act="manage">Add your first bucket</button></div>';
  } else {
    const n = list.length, cols = Math.ceil(n / Math.ceil(n / 4)); // balanced rows: 5→3+2, 7→4+3, never a lone orphan
    box.innerHTML = '<div class="buckets" style="grid-template-columns:repeat(' + cols + ',1fr)">' + list.map(b => {
      const v = bal[b.id] || 0, pct = total > 0 ? Math.round(v / total * 1000) / 10 : 0;
      return '<div class="bucket"><div><div class="name"><span class="dot" style="background:' + b.color + '"></span>' + esc(b.name) + '</div>' +
        (earned[b.id] ? '<div class="btc">₿ ' + fmtSats(earned[b.id]) + '</div>' : "") + '</div>' +
        '<div><div class="bal">' + fmt(v) + '</div><div class="pct">' + pct + '% of total</div></div></div>';
    }).join("") + '</div>' +
    (total > 0 ? '<div class="bar">' + list.map(b => '<span style="background:' + b.color + ';width:' + Math.max(0, (bal[b.id] || 0) / total * 100) + '%"></span>').join("") + '</div>' : "");
  }

  // bucket filter lists every bucket that has history, removed ones included
  const fb = $("flt-bucket"), used = state.buckets.filter(b => !b.archived || state.txns.some(t => share(t, b.id)));
  if (filter.bucket && !used.some(b => b.id === filter.bucket)) filter.bucket = "";
  fb.innerHTML = '<option value="">All buckets</option>' + used.map(b => '<option value="' + b.id + '">' + esc(b.name) + (b.archived ? " (removed)" : "") + '</option>').join("");
  fb.value = filter.bucket; $("flt-type").value = filter.type;
  fb.classList.toggle("on", !!filter.bucket); $("flt-type").classList.toggle("on", !!filter.type);
  $("filters").style.display = state.txns.length ? "" : "none";

  const all = state.txns.slice().sort((a, b) => (b.date + b.created).localeCompare(a.date + a.created));
  const tx = all.filter(t => (!filter.type || typeKey(t) === filter.type) && (!filter.bucket || share(t, filter.bucket)));
  const shown = showAll ? tx : tx.slice(0, 25), filtered = filter.type || filter.bucket;
  $("activity").innerHTML = !all.length ? '<div class="empty">Nothing logged yet.</div>' :
    (filtered ? '<div class="fsum"><span>' + tx.length + ' of ' + all.length + ' entries</span><a href="#" data-act="clearFilters">Clear filters</a></div>' : "") +
    (!tx.length ? '<div class="empty">No entries match these filters.</div>' :
    '<div class="list">' + shown.map(t => rowHtml(t, filter.bucket)).join("") +
    (tx.length > 25 ? '<div class="row more"><button class="pill" data-act="toggleAll">' + (showAll ? "Show recent" : "Show all " + tx.length) + '</button></div>' : "") + '</div>');

  document.querySelectorAll('[data-act="withdraw"],[data-act="move"],[data-act="interest"],[data-act="deposit"]').forEach(b => b.disabled = !list.length);
}

const typeKey = t => t.type === "btcInterest" ? "interest" : t.type;
/* This bucket's piece of an entry, or null if the entry doesn't touch it. */
function share(t, id) {
  if (t.type === "deposit" || t.type === "withdraw") { const c = partsOf(t)[id]; return c ? { text: (t.type === "deposit" ? "+" : "−") + fmt(c), cls: t.type === "deposit" ? "pos" : "neg", whole: Object.keys(partsOf(t)).length > 1 } : null; }
  if (t.type === "move") return t.from === id ? { text: "−" + fmt(t.amount), cls: "neg" } : t.to === id ? { text: "+" + fmt(t.amount), cls: "pos" } : null;
  if (t.splits && t.splits[id]) return { text: "+" + (t.type === "btcInterest" ? fmtSats(t.splits[id]) : fmt(t.splits[id])), cls: "pos", whole: Object.keys(t.splits).length > 1 };
  return null;
}
function rowHtml(t, focus) {
  let what, meta = t.date, amt, cls = "";
  if (t.type === "deposit" || t.type === "withdraw") {
    const p = partsOf(t), ids = Object.keys(p), dep = t.type === "deposit";
    what = (dep ? "Deposit → " : "Withdraw ← ") + ids.map(id => esc(bucketName(id))).join(", ");
    if (ids.length > 1) meta += " · " + ids.map(id => esc(bucketName(id)) + " " + fmt(p[id])).join(", ");
    amt = (dep ? "+" : "−") + fmt(t.amount); cls = dep ? "pos" : "neg"; }
  else if (t.type === "move") { what = esc(bucketName(t.from)) + " → " + esc(bucketName(t.to)); amt = fmt(t.amount); }
  else if (t.type === "btcInterest") { what = "BTC interest · " + shortDate(t.start) + " – " + shortDate(t.end); amt = "+" + fmtSats(t.sats); cls = "pos";
    meta = "Received " + t.date + " · " + Object.keys(t.splits).map(id => esc(bucketName(id)) + " " + t.pct[id].toFixed(2) + "% (" + t.splits[id].toLocaleString("en-US") + ")").join(", "); }
  else { what = "Interest (cash)"; amt = "+" + fmt(t.amount); cls = "pos";
    meta += " · " + Object.keys(t.splits).map(id => esc(bucketName(id)) + " " + fmt(t.splits[id])).join(", "); }
  if (t.note) meta += " · " + esc(t.note);
  const mine = focus && share(t, focus); // filtered to one bucket: show its piece, with the Strike total underneath
  if (mine) { cls = mine.cls; amt = mine.text + (mine.whole ? "<small>of " + (t.type === "btcInterest" ? fmtSats(t.sats) : fmt(t.amount)) + "</small>" : ""); }
  return '<div class="row"><div class="main"><div class="what">' + what + '</div><div class="meta">' + meta + '</div></div>' +
    '<div class="amt ' + cls + '">' + amt + '</div><button class="x" title="Delete" data-del="' + t.id + '">×</button></div>';
}

/* ---------- sheets ---------- */
/* Freeze the page behind an open sheet. iOS Safari ignores overflow:hidden on body,
   so pin the body in place and restore the scroll position on close. */
let lockedY = null;
function lockScroll() {
  if (lockedY !== null) return;
  lockedY = window.scrollY;
  Object.assign(document.body.style, { position: "fixed", top: -lockedY + "px", left: "0", right: "0", width: "100%", overflow: "hidden" });
}
function unlockScroll() {
  if (lockedY === null) return;
  Object.assign(document.body.style, { position: "", top: "", left: "", right: "", width: "", overflow: "" });
  window.scrollTo(0, lockedY); lockedY = null;
}
function open(html, onReady) {
  const fresh = lockedY === null;
  $("sheet").innerHTML = html; $("shade").classList.add("open"); lockScroll();
  if (fresh) $("sheet").scrollTop = 0;
  const first = $("sheet").querySelector("input,select"); if (first && matchMedia("(pointer:fine)").matches) first.focus();
  if (onReady) onReady();
}
function close() { $("shade").classList.remove("open"); $("sheet").innerHTML = ""; unlockScroll(); }
$("shade").addEventListener("click", e => { if (e.target.id === "shade") close(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

const bucketOpts = (sel, bal) => activeBuckets().map(b => '<option value="' + b.id + '"' + (b.id === sel ? " selected" : "") + '>' + esc(b.name) + (bal ? " — " + fmt(bal[b.id] || 0) : "") + '</option>').join("");
const dateField = '<label>Date</label><input type="date" id="f-date" value="' + today() + '">';
const noteField = '<label>Note (optional)</label><input id="f-note" maxlength="80" placeholder="e.g. paycheck, rent">';
const btns = label => '<div class="btns"><button class="pill" data-act="close">Cancel</button><button class="pill primary" id="f-go">' + label + '</button></div>';
const val = id => ($(id) || {}).value || "";

/* One Strike deposit/withdrawal, split across any number of buckets. The bucket amounts must add
   up to exactly what Strike shows, and a withdrawal can't take more than a bucket holds. */
function sheetSplit(kind) {
  const dep = kind === "deposit", bal = balances(), list = activeBuckets();
  open('<h3>' + (dep ? "Deposit" : "Withdraw") + '</h3><p class="hint">' + (dep ? "Enter the deposit Strike shows, then whose money it is." : "Enter the withdrawal Strike shows, then whose money it came out of.") + ' Split it across as many buckets as you need.</p>' +
    '<label>Total ' + (dep ? "deposit" : "withdrawal") + ' in Strike</label><input id="f-amt" inputmode="decimal" placeholder="0.00">' +
    '<label>' + (dep ? "Into" : "From") + ' buckets</label><div class="splits">' + list.map(b =>
      '<div class="split-row" data-row="' + b.id + '"><div class="who"><b><span class="dot" style="background:' + b.color + '"></span>' + esc(b.name) + '</b><small>Has ' + fmt(bal[b.id] || 0) + '</small></div>' +
      '<button class="pill" data-rest="' + b.id + '">Rest</button><input data-part="' + b.id + '" inputmode="decimal" placeholder="0.00"></div>').join("") + '</div>' +
    '<div class="status" id="f-status"></div>' + dateField + noteField + btns(dep ? "Add deposit" : "Withdraw"), () => {
    const inputs = [...$("sheet").querySelectorAll("[data-part]")];
    const read = () => {
      const total = parseMoney(val("f-amt")), parts = {}, bad = [];
      let sum = 0;
      for (const inp of inputs) {
        const id = inp.dataset.part, raw = inp.value.trim(), row = inp.closest(".split-row"), note = row.querySelector("small");
        let flag = "";
        if (raw) {
          const c = parseMoney(raw);
          if (c === null) flag = "Not a valid amount";
          else if (c > 0) { parts[id] = c; sum += c; if (!dep && c > (bal[id] || 0)) flag = "Only has " + fmt(bal[id] || 0) + " — over by " + fmt(c - (bal[id] || 0)); }
        }
        row.classList.toggle("bad", !!flag); note.classList.toggle("flag", !!flag);
        note.textContent = flag || "Has " + fmt(bal[id] || 0);
        if (flag) bad.push(bucketName(id) + ": " + flag);
      }
      return { total, parts, sum, bad };
    };
    const upd = () => {
      const r = read(), st = $("f-status");
      st.className = "status";
      if (!r.total) st.textContent = r.sum ? "Assigned " + fmt(r.sum) + " — enter the total Strike shows" : "Enter the total, then split it";
      else if (r.sum > r.total) { st.className = "status bad"; st.textContent = "⚠ Over by " + fmt(r.sum - r.total) + " — buckets add up to " + fmt(r.sum) + ", Strike shows " + fmt(r.total); }
      else if (r.sum < r.total) { st.className = "status bad"; st.textContent = "⚠ " + fmt(r.total - r.sum) + " still unassigned of " + fmt(r.total); }
      else if (r.bad.length) { st.className = "status bad"; st.textContent = "⚠ Adds up, but a bucket is overdrawn"; }
      else { st.className = "status ok"; st.textContent = "✓ Adds up to " + fmt(r.total) + (Object.keys(r.parts).length > 1 ? " across " + Object.keys(r.parts).length + " buckets" : ""); }
    };
    $("f-amt").oninput = upd; inputs.forEach(i => i.oninput = upd);
    $("sheet").querySelectorAll("[data-rest]").forEach(btn => btn.onclick = () => {
      const r = read(), inp = inputs.find(i => i.dataset.part === btn.dataset.rest), mine = r.parts[btn.dataset.rest] || 0;
      if (!r.total) return showError("Enter the total first", "Rest fills a bucket with whatever's left of the total. Do this: type the amount Strike shows at the top, then tap Rest.");
      const left = r.total - (r.sum - mine);
      if (left <= 0) return showError("Nothing left to assign", "The other buckets already cover the total. Do this: lower one of them first.");
      inp.value = (left / 100).toFixed(2); upd();
    });
    upd();
    $("f-go").onclick = () => {
      const r = read(), verb = dep ? "Add deposit" : "Withdraw";
      if (!r.total) return showError("Total isn't valid", "Nothing was saved. Do this: enter the amount Strike shows, like 100 or 100.50.");
      if (!r.sum) return showError("No bucket amounts entered", "Nothing was saved. Do this: type how much belongs to each bucket (or tap Rest on one bucket to give it the whole amount).");
      if (r.bad.length) return showError("Fix the flagged bucket", "Nothing was saved. " + r.bad.join("; ") + ". Do this: correct that amount, then tap " + verb + " again.");
      if (r.sum !== r.total) return showError(r.sum > r.total ? "Buckets add up to " + fmt(r.sum - r.total) + " too much" : fmt(r.total - r.sum) + " isn't assigned to a bucket",
        "Nothing was saved. The buckets must add up to exactly " + fmt(r.total) + ". Do this: adjust the bucket amounts (or tap Rest on one), then tap " + verb + " again.");
      addTxn({ type: kind, amount: r.total, parts: r.parts });
      toast((dep ? "Added " : "Took ") + fmt(r.total) + (dep ? " to " : " from ") + Object.keys(r.parts).map(bucketName).join(", "));
    };
  });
}

function sheetMove() {
  const bal = balances(), list = activeBuckets();
  if (list.length < 2) return showError("Need two buckets to move money", "Do this: tap Buckets… at the bottom and add a second bucket, then try Move again.");
  open('<h3>Move between buckets</h3><p class="hint">Reassign money inside Strike. Your Strike balance doesn\'t change.</p>' +
    '<label>Amount</label><input id="f-amt" inputmode="decimal" placeholder="0.00">' +
    '<label>From</label><select id="f-from">' + bucketOpts(list[0].id, bal) + '</select>' +
    '<label>To</label><select id="f-to">' + bucketOpts(list[1].id, bal) + '</select>' + dateField + noteField + btns("Move"), () => {
    $("f-go").onclick = () => {
      const a = parseMoney(val("f-amt")), from = val("f-from"), to = val("f-to");
      if (!a) return showError("Amount isn't valid", "Nothing was saved. Do this: enter a dollar amount like 250 or 250.75, then tap Move again.");
      if (from === to) return showError("From and To are the same bucket", "Nothing was saved. Do this: pick two different buckets.");
      if (a > (bal[from] || 0)) return showError(bucketName(from) + " only has " + fmt(bal[from] || 0), "Nothing was saved. Do this: lower the amount to " + fmt(bal[from] || 0) + " or less.");
      addTxn({ type: "move", amount: a, from, to }); toast("Moved " + fmt(a) + " to " + bucketName(to));
    };
  });
}

/* Strike pays interest monthly, in bitcoin, on the cash balance. Each bucket's share is its
   average daily balance over the interest period, so money that sat there all month earns
   more than money that arrived on the 28th. */
function btcSplit(sats, usd, start, end) {
  const { avg, days } = avgDaily(start, end);
  const base = Object.values(avg).reduce((a, c) => a + c, 0);
  if (!base) return null;
  const pct = {}; for (const id in avg) if (avg[id] > 0) pct[id] = Math.round(avg[id] / base * 1e6) / 1e4;
  return { avg, days, pct, splits: sats ? splitProRata(sats, avg) : null, usdSplits: usd ? splitProRata(usd, avg) : null };
}

function sheetBtcInterest() {
  const [ps, pe] = prevMonth(today());
  open('<h3>BTC interest</h3><p class="hint">Strike pays monthly in bitcoin. Each bucket gets its share of the average daily cash balance over the interest period.</p>' +
    '<label>Amount received (sats, or BTC with a decimal)</label><input id="f-sats" inputmode="decimal" placeholder="12345  or  0.00012345">' +
    '<div class="sub" id="f-conv" style="margin-top:4px"></div>' +
    '<label>Dollar value when received (optional, for taxes)</label><input id="f-usd" inputmode="decimal" placeholder="0.00">' +
    '<div class="two"><div><label>Interest period from</label><input type="date" id="f-start" value="' + ps + '"></div>' +
    '<div><label>to</label><input type="date" id="f-end" value="' + pe + '"></div></div>' +
    '<div id="f-prev"></div>' +
    '<label>Date received</label><input type="date" id="f-date" value="' + today() + '">' + noteField + btns("Add BTC interest"), () => {
    const upd = () => {
      const sats = parseSats(val("f-sats")), usd = parseMoney(val("f-usd")), st = val("f-start"), en = val("f-end");
      $("f-conv").textContent = sats ? (val("f-sats").includes(".") ? "= " + fmtSats(sats) : "= " + fmtBtc(sats)) : "";
      if (!st || !en || st > en) { $("f-prev").innerHTML = '<div class="warnbox">Pick a period where "from" is on or before "to".</div>'; return; }
      const r = btcSplit(sats, usd, st, en);
      if (!r) { $("f-prev").innerHTML = '<div class="warnbox">No bucket held cash between ' + shortDate(st) + ' and ' + shortDate(en) + '. Check the dates on your deposits.</div>'; return; }
      const first = state.txns.filter(t => t.type === "deposit").map(t => t.date).sort()[0];
      $("f-prev").innerHTML = '<div class="preview"><div class="r head"><span>' + r.days + ' days · avg balance</span><span>Share' + (sats ? ' · sats' : '') + (usd ? ' · $' : '') + '</span></div>' +
        activeBuckets().concat(state.buckets.filter(b => b.archived && r.pct[b.id])).filter(b => r.pct[b.id]).map(b =>
          '<div class="r"><span><span class="dot" style="display:inline-block;margin-right:6px;background:' + b.color + '"></span>' + esc(b.name) + ' · ' + fmt(Math.round(r.avg[b.id])) + '</span><span><b>' + r.pct[b.id].toFixed(2) + '%</b>' +
          (sats ? ' · ' + (r.splits[b.id] || 0).toLocaleString("en-US") : '') + (usd ? ' · ' + fmt(r.usdSplits[b.id] || 0) : '') + '</span></div>').join("") + '</div>' +
        (first && first > st ? '<div class="warnbox">Your first deposit is dated ' + shortDate(first) + ', after this period starts, so earlier days count as $0. If the money was in Strike before that, delete that deposit and re-add it with the real date.</div>' : "");
    };
    ["f-sats", "f-usd", "f-start", "f-end"].forEach(id => $(id).oninput = upd); upd();
    $("f-go").onclick = () => {
      const sats = parseSats(val("f-sats")), usdRaw = val("f-usd").trim(), usd = usdRaw ? parseMoney(usdRaw) : null, st = val("f-start"), en = val("f-end");
      if (!sats) return showError("Amount isn't valid", "Nothing was saved. Do this: enter the bitcoin Strike paid, as sats (12345) or BTC with a decimal (0.00012345).");
      if (usdRaw && !usd) return showError("Dollar value isn't valid", "Nothing was saved. Do this: enter it like 8.42, or leave it blank.");
      if (!st || !en || st > en) return showError("Interest period isn't valid", "Nothing was saved. Do this: set \"from\" on or before \"to\" — usually the first and last day of last month.");
      const r = btcSplit(sats, usd, st, en);
      if (!r) return showError("No bucket held cash in that period", "Nothing was saved. Do this: check the period dates, or delete and re-add your starting deposits with the date the money actually arrived.");
      const t = { type: "btcInterest", sats, start: st, end: en, pct: r.pct, splits: r.splits };
      if (usd) { t.usd = usd; t.usdSplits = r.usdSplits; }
      addTxn(t); toast("Split " + fmtSats(sats) + " across " + Object.keys(r.splits).length + " buckets");
    };
  });
}

function sheetReconcile() {
  const total = totalOf(balances());
  open('<h3>Reconcile</h3><p class="hint">Enter the cash balance the Strike app shows right now. Tracked here: <b>' + fmt(total) + '</b></p>' +
    '<label>Strike cash balance</label><input id="f-amt" inputmode="decimal" placeholder="0.00">' +
    '<div id="f-res"></div>' + btns("Check"), () => {
    const check = () => {
      const a = parseMoney(val("f-amt"));
      if (a === null) return showError("Amount isn't valid", "Nothing was saved. Do this: type the balance from the Strike app, like 12500.42.");
      state.lastRecon = { actual: a, date: today() }; save(); render();
      const d = a - total, res = $("f-res");
      if (d === 0) { res.innerHTML = '<div class="preview"><div class="r"><span>All accounted for. Every dollar has an owner.</span></div></div>'; $("f-go").textContent = "Done"; $("f-go").onclick = close; }
      else if (d > 0) {
        res.innerHTML = '<div class="preview"><div class="r"><span>Strike has <b>' + fmt(d) + '</b> more than tracked.</span></div><div class="r"><span>Probably a deposit that isn\'t logged yet. Log it with Deposit into the right buckets. (BTC interest doesn\'t land in cash, so it never shows up here.)</span></div></div>';
      } else {
        res.innerHTML = '<div class="preview"><div class="r"><span>Strike has <b>' + fmt(-d) + '</b> less than tracked.</span></div><div class="r"><span>Probably a withdrawal or BTC buy that isn\'t logged. Log it with Withdraw from the right buckets.</span></div></div>';
      }
    };
    $("f-go").onclick = check;
  });
}

function sheetManage() {
  const bal = balances();
  const rows = activeBuckets().map(b => '<div class="manage-row"><span class="dot" style="background:' + b.color + '"></span>' +
    '<input data-ren="' + b.id + '" value="' + esc(b.name) + '" maxlength="40"><button class="pill danger" data-rm="' + b.id + '">Remove</button></div>').join("");
  open('<h3>Buckets</h3><p class="hint">Who owns what slice of the balance — e.g. My Savings, Partner Savings, Joint Checking.</p>' +
    (rows || "") + '<label>New bucket</label><div class="manage-row"><input id="f-new" maxlength="40" placeholder="Bucket name"><button class="pill primary" id="f-add">Add</button></div>' +
    '<div class="btns"><button class="pill" data-act="close">Done</button></div>', () => {
    const add = () => {
      const name = val("f-new").trim();
      if (!name) return showError("Bucket needs a name", "Do this: type a name like \"Partner Savings\", then tap Add.");
      if (activeBuckets().some(b => b.name.toLowerCase() === name.toLowerCase())) return showError("\"" + name + "\" already exists", "Do this: pick a different name.");
      state.buckets.push({ id: uid(), name, color: COLORS[state.buckets.length % COLORS.length] });
      save(); render(); sheetManage(); toast("Added " + name);
    };
    $("f-add").onclick = add;
    $("f-new").onkeydown = e => { if (e.key === "Enter") add(); };
    $("sheet").querySelectorAll("[data-ren]").forEach(inp => inp.onchange = () => {
      const name = inp.value.trim(), b = state.buckets.find(x => x.id === inp.dataset.ren);
      if (!name) { inp.value = b.name; return showError("Bucket needs a name", "The old name was kept. Do this: type a new name instead of clearing it."); }
      b.name = name; save(); render();
    });
    $("sheet").querySelectorAll("[data-rm]").forEach(btn => btn.onclick = () => {
      const id = btn.dataset.rm, v = bal[id] || 0;
      if (v !== 0) return showError(bucketName(id) + " still holds " + fmt(v),
        "Nothing was removed. Do this: Move its money to another bucket (or Withdraw it), then remove it.");
      const b = state.buckets.find(x => x.id === id);
      if (state.txns.some(t => partsOf(t)[id] || t.from === id || t.to === id || (t.splits && t.splits[id]))) b.archived = true; // keep history readable
      else state.buckets = state.buckets.filter(x => x.id !== id);
      save(); render(); sheetManage(); toast("Removed " + b.name);
    });
  });
}

function addTxn(t) {
  t.id = uid(); t.created = new Date().toISOString(); t.date = val("f-date") || today();
  const note = val("f-note").trim(); if (note) t.note = note;
  state.txns.push(t); save(); close(); render();
}

/* ---------- backup ---------- */
function exportJson() {
  const blob = new Blob([JSON.stringify({ app: "strike-buckets", version: 1, exported: new Date().toISOString(), ...state }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "strike-buckets-" + today() + ".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Backup downloaded");
}
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const s = normalize(JSON.parse(await f.text()));
    if (state.txns.length && !confirm("Replace everything here with the backup from " + f.name + "? Current data will be overwritten.")) return;
    state = s; save(); render(); toast("Restored " + s.buckets.length + " buckets, " + s.txns.length + " entries");
  } catch (err) {
    showError("Couldn't restore that file", "Your current data is untouched. Do this: pick a .json file made by this app's Back up button (named strike-buckets-YYYY-MM-DD.json).");
  }
};

/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) {
    const t = state.txns.find(x => x.id === del.dataset.del); if (!t) return;
    if (!confirm("Delete this entry? Balances will be recalculated.")) return;
    const bal = balances();
    const short = t.type === "deposit" && Object.entries(partsOf(t)).find(([id, c]) => (bal[id] || 0) - c < 0);
    if (short)
      return showError("Can't delete that deposit yet", "Later entries spend that money, so " + bucketName(short[0]) + " would go negative. Nothing changed. Do this: delete the later withdrawal or move first.");
    if (t.type === "move" && (bal[t.to] || 0) - t.amount < 0)
      return showError("Can't delete that move yet", "Later entries spend that money, so " + bucketName(t.to) + " would go negative. Nothing changed. Do this: delete the later entry first.");
    state.txns = state.txns.filter(x => x.id !== t.id); save(); render(); toast("Entry deleted");
    return;
  }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  ({ deposit: () => sheetSplit("deposit"), withdraw: () => sheetSplit("withdraw"), move: sheetMove, interest: sheetBtcInterest, reconcile: sheetReconcile,
     manage: sheetManage, export: exportJson, import: () => $("file").click(), close,
     toggleAll: () => { showAll = !showAll; render(); },
     clearFilters: () => { e.preventDefault(); filter.type = filter.bucket = ""; render(); } })[b.dataset.act]();
});

/* ---------- toasts ---------- */
let toastTimer;
function toast(msg) {
  const t = $("toast"); clearTimeout(toastTimer);
  t.className = "toast show"; t.textContent = msg;
  toastTimer = setTimeout(() => t.className = "toast", 2200);
}
function showError(title, fix) {
  const t = $("toast"); clearTimeout(toastTimer);
  t.className = "toast err show";
  t.innerHTML = '<span class="close" aria-label="Dismiss">✕</span><b>' + esc(title) + '</b>' + esc(fix);
  t.querySelector(".close").onclick = () => t.className = "toast";
  toastTimer = setTimeout(() => t.className = "toast", 9000);
}
window.addEventListener("error", e => showError("Something broke", "Your saved data is safe. Do this: tap Back up to keep a copy, then reload the page. (" + (e.message || "unknown error") + ")"));
window.addEventListener("unhandledrejection", e => showError("Something broke", "Your saved data is safe. Do this: tap Back up to keep a copy, then reload the page. (" + ((e.reason && e.reason.message) || "unknown error") + ")"));

/* manifest so Add to Home Screen opens full-screen */
(() => {
  const m = { name: "Strike Buckets", short_name: "Buckets", display: "standalone", background_color: "#000000", theme_color: "#000000", start_url: location.origin + location.pathname };
  const l = document.createElement("link"); l.rel = "manifest";
  l.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(m)); document.head.appendChild(l);
})();

/* ---------- updates ----------
   A Home Screen app on iOS resumes from memory instead of reloading, and GitHub Pages lets the
   phone reuse its cached copy, so it can sit on an old version. On open and every time the app
   comes back to the foreground, fetch the live page (bypassing the cache, which also refreshes it)
   and offer a reload if its version differs. Your data is in localStorage and survives updates. */
const BASE = location.origin + location.pathname;
let newVersion = null, lastCheck = 0;
async function checkForUpdate(manual) {
  if (!manual && Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  try {
    const res = await fetch(BASE, { cache: "reload" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const m = (await res.text()).match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION) { newVersion = m[1]; $("update").classList.add("show"); }
    else if (manual) toast("You're on the latest version (" + APP_VERSION + ")");
  } catch (e) {
    if (manual) showError("Couldn't check for updates", "You're probably offline. Your data is safe. Do this: connect to the internet, then tap Check for updates again.");
  }
}
$("upd-go").onclick = () => {
  if ($("shade").classList.contains("open") && !confirm("Update now? The form you have open will be closed without saving.")) return;
  location.replace(BASE + "?v=" + encodeURIComponent(newVersion)); // new URL forces a fresh load; data is untouched
};
$("upd-check").onclick = e => { e.preventDefault(); checkForUpdate(true); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
window.addEventListener("pageshow", e => { if (e.persisted) checkForUpdate(); });
$("ver").textContent = "Version " + APP_VERSION;
if (location.search) history.replaceState(null, "", BASE); // drop ?v= so the Home Screen URL stays clean

$("flt-type").onchange = e => { filter.type = e.target.value; showAll = false; render(); };
$("flt-bucket").onchange = e => { filter.bucket = e.target.value; showAll = false; render(); };

load(); render(); checkForUpdate();
</script>
</body>
